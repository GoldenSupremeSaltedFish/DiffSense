name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.2.10)'
        required: false
        type: string
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          pip install build twine

      - name: Prepare package (include MCP module)
        run: |
          cp -r diffsense_mcp diffsense/diffsense_mcp

      - name: Build package
        run: |
          cd diffsense
          python -m build

      - name: Check package
        run: |
          twine check diffsense/dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: diffsense/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify PyPI token is configured
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::Repository secret PYPI_TOKEN is missing or empty."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name must be exactly: PYPI_TOKEN"
            exit 1
          fi
          echo "PyPI token is configured."
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: false
