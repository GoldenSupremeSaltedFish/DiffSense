name: DiffSense — Image Line

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-diffsense:
    name: Test DiffSense (Python)
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('diffsense/requirements.txt','diffsense/pyproject.toml') }}

      - name: Install deps (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "diffsense[dev]"

      - name: Run tests
        run: pytest -q

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffsense-report
          path: diffsense/diffsense-report.json
          if-no-files-found: warn

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-diffsense
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像命名空间为小写
      - name: Compute image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 非 tag 事件只构建验证，tag v* 才推送镜像
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./diffsense
          file: ./diffsense/Dockerfile.ci
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/diffsense:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/diffsense:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 未配置 PYPI_API_TOKEN 时跳过发布，不让流水线失败
      - name: Check PyPI token
        id: guard
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::warning::PYPI_API_TOKEN 未配置，跳过 PyPI 发布"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & publish PyPI
        if: steps.guard.outputs.ok == 'true'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install build twine
          python -m build ./diffsense
          python -m twine upload dist/* -u __token__ -p "${PYPI_API_TOKEN}"