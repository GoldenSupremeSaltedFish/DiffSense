rules:
  - id: null.nil_dereference
    language: go
    severity: high
    impact: runtime
    file: "**/*.go"
    match: '\(\s*\*\s*\w+\s*\)|\*\s*\w+\s*\.'
    rationale: "Explicit pointer dereference pattern introduced; verify pointer nil checks near the dereference site. Defensive additions such as nil guards and logging calls (logger.Warn) are not flagged."
