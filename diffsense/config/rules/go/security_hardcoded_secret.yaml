rules:
  - id: go.security.hardcoded_secret
    language: go
    severity: critical
    impact: security
    file: "**/*.go"
    case_insensitive: true
    match: '(password|passwd|secret|token|api[_-]?key)\s*[:=]\s*"[^"]{8,}"|\w+:[^@\s]+@tcp\([^)]+\)/\w+'
    rationale: "Hardcoded secrets detected in Go source (including hardcoded DSN credentials like user:pass@tcp(host)/db); move credentials to environment variables or secret managers."
