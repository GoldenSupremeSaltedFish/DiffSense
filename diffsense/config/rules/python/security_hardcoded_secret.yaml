rules:
  - id: python.security.hardcoded_secret
    language: python
    severity: critical
    impact: security
    file: "**/*.py"
    case_insensitive: true
    match: '(password|passwd|secret|token|api[_-]?key|access[_-]?key)\s*[:=]\s*["''][^"'']{6,}["'']'
    rationale: "Hardcoded credentials assigned to a literal value; move to environment variables or a secret manager. Bare identifier mentions (e.g. function parameters named password) are not flagged."
