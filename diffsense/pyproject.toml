[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsense"
version = "2.3.0"
description = "MR/PR risk audit: semantic diff + rule engine. Run in CI as image or pip."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML",
  "PyGithub",
  "python-gitlab",
  "requests",
  "javalang",
  "typer>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "jsonschema>=4.0", "mcp>=2.0"]
mcp = ["mcp>=2.0"]

[project.scripts]
diffsense = "cli:app"
diffsense-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "core*", "governance*", "rules*", "rules.pro*", "config*", "sdk*", "schemas*"]

[tool.setuptools.package-data]
config = ["*.yaml"]
schemas = ["*.json"]

[tool.setuptools]
py-modules = ["cli", "run_audit", "main", "banner", "constants", "sarif", "mcp_server"]
