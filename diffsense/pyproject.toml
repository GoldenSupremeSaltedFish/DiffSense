[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsense"
version = "2.3.1"
description = "MR/PR risk audit: semantic diff + rule engine. Run in CI as image or pip."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  # #156: compatible-range constraints (upper-bounded) instead of unbounded >=,
  # so installs stay predictable and supply-chain attacks can't pull arbitrary new majors.
  "PyYAML~=6.0",
  "PyGithub~=2.10",
  "python-gitlab~=8.6",
  "requests~=2.34",
  "javalang~=0.13",
  "typer~=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "jsonschema~=4.26", "mcp~=2.3"]
mcp = ["mcp~=2.3"]

[project.scripts]
diffsense = "cli:app"
diffsense-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "core*", "governance*", "rules*", "rules.pro*", "config*", "sdk*", "schemas*"]

[tool.setuptools.package-data]
config = ["*.yaml"]
schemas = ["*.json"]

[tool.setuptools]
py-modules = ["cli", "run_audit", "main", "banner", "constants", "sarif", "mcp_server"]
